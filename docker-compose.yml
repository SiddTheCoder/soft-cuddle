services:
  postgres:
    # 18 to match Neon, which no longer offers 16. See docs/MEMORY.md,
    # "Deviations from the docs". ENVIRONMENT.md still says 16 — the intent of
    # that line is "match Neon's major version", and this does.
    image: postgres:18-alpine
    container_name: softmato-postgres
    environment:
      POSTGRES_PASSWORD: softmato
      POSTGRES_DB: softmato_dev
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d softmato_dev']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: softmato-redis
    ports: ['6379:6379']

volumes:
  pgdata:
